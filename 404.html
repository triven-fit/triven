<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triven</title><meta name="robots" content="noindex">
<meta name="robots" content="noindex">
<script>
// Clean addresses open in the app: /log/bests → /#log/bests, /carlg/412 → /#u/carlg/412. Anything else goes home.
// Keep APP in step with js/urls.js.
(function () {
  var APP = ['feed', 'log', 'upload', 'gear', 'people', 'club', 'a', 'c', 'r', 'join', 'reset', 'me', 'admin', 'feedback'];
  var p = location.pathname.replace(/^\/+|\/+$/g, '').split('/'), q = location.search.replace(/[?&]build=\d+/, '').replace(/^&/, '?');
  var to = '';
  if (APP.indexOf(p[0]) >= 0) to = '#' + p.join('/') + q;
  else if (/^[a-z0-9][a-z0-9_-]{2,29}$/i.test(p[0]) && (p.length === 1 || (p.length === 2 && /^\d{1,7}$/.test(p[1])))) to = '#u/' + p.join('/').toLowerCase();
  location.replace('/' + to);
})();
</script></head>
<body style="font-family:system-ui,sans-serif;padding:40px;text-align:center;color:#555">Opening Triven… <a href="/">triven.fit</a></body></html>
